name: Validate Skill

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile scripts/*.py

      - name: Validate tag rule JSON
        run: python -c "import json; json.load(open('references/tag-rules.json', encoding='utf-8'))"

      - name: Run tag quality tests
        run: python scripts/test_tag_quality.py

      - name: Run fixture export validation
        run: python scripts/validate_export_agent_history.py

      - name: Check patch formatting
        run: git diff --check
